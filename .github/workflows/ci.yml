name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  base-de-datos:
    name: Carga y verificación de la base
    runs-on: ubuntu-latest

    # Se usa un service de PostgreSQL en lugar del docker-compose.yml del repo:
    # el runner ya expone el contenedor en localhost y espera al healthcheck,
    # asi que compose solo agregaria una capa de indireccion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proyecto_bd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proyecto_bd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: proyecto_bd

    steps:
      - uses: actions/checkout@v4

      - name: Instalar el cliente de PostgreSQL
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # El orden importa: las restricciones dependen de las tablas, la carga de
      # datos de los catalogos, los indices conviene crearlos con los datos ya
      # cargados, y 08_Concurrencia.sql llama a los procedimientos que define 07.
      - name: Ejecutar los ocho scripts SQL en orden
        run: |
          set -euo pipefail
          for script in \
            ScriptSQL/01_Creacion_Estructura.sql \
            ScriptSQL/02_Restricciones.sql \
            ScriptSQL/03_Carga_Datos.sql \
            ScriptSQL/04_Consultas_Reportes.sql \
            ScriptSQL/05_Indices.sql \
            ScriptSQL/06_Seguridad_Roles.sql \
            ScriptSQL/07_Funciones_Procedimientos.sql \
            ScriptSQL/08_Concurrencia.sql
          do
            echo "::group::$script"
            psql -q -v ON_ERROR_STOP=1 -f "$script"
            echo "::endgroup::"
          done

      - name: Verificar la integridad de la base
        run: psql -v ON_ERROR_STOP=1 -f Pruebas/verificaciones_ci.sql

      # 04 ya se ejecuto arriba, pero ahi la base recien salia de 03. Se vuelve a
      # correr al final, contra el estado que dejaron los indices, los roles, los
      # triggers y las transacciones de 08.
      - name: Reejecutar las consultas de reportes sobre el estado final
        run: psql -q -v ON_ERROR_STOP=1 -f ScriptSQL/04_Consultas_Reportes.sql

  generador-de-datos:
    name: Dataset masivo generado
    runs-on: ubuntu-latest
    # Generar dos veces y cargar 1,6 millones de renglones tarda unos minutos.
    # El limite es para que un cuelgue falle rapido, no las 6 horas por defecto.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proyecto_bd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proyecto_bd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: proyecto_bd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Las versiones van fijas a proposito: un release de pandas no tiene por
      # que poner el build en rojo sin que nadie haya tocado el repositorio.
      - name: Instalar dependencias
        run: |
          pip install 'pandas==2.2.3' 'numpy==2.1.3'
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      # Los CSVs no se versionan porque el generador es determinista. Eso se
      # prueba aca: dos corridas completas tienen que dar los mismos archivos.
      - name: Generar el dataset dos veces y comparar
        working-directory: Datos
        run: |
          set -euo pipefail
          for corrida in 1 2; do
            rm -rf generado
            python generar_masivos.py
            python generador_datos.py
            (cd generado && sha256sum *.csv) > "$RUNNER_TEMP/sha_$corrida.txt"
          done
          cat "$RUNNER_TEMP/sha_1.txt"
          if ! diff "$RUNNER_TEMP/sha_1.txt" "$RUNNER_TEMP/sha_2.txt"; then
            echo "!! Dos corridas del generador produjeron CSVs distintos" >&2
            exit 1
          fi

      # Mismo orden que setup.sh con CARGA=masiva. 08_Concurrencia.sql queda
      # afuera: es un guion para dos sesiones interactivas, y ya se ejecuta en el
      # job de la carga base.
      - name: Cargar el dataset masivo
        working-directory: Datos
        run: |
          set -euo pipefail
          for script in \
            ../ScriptSQL/01_Creacion_Estructura.sql \
            ../ScriptSQL/02_Restricciones.sql \
            Carga_Masiva.sql \
            ../ScriptSQL/05_Indices.sql \
            ../ScriptSQL/06_Seguridad_Roles.sql \
            ../ScriptSQL/07_Funciones_Procedimientos.sql
          do
            echo "::group::$script"
            psql -q -v ON_ERROR_STOP=1 -f "$script"
            echo "::endgroup::"
          done

      # Incluye cero stock negativo y cero discrepancias entre Inventario y el
      # neto de los movimientos, que es lo que garantiza la apertura del generador.
      - name: Verificar la integridad del dataset masivo
        run: psql -v ON_ERROR_STOP=1 -f Pruebas/verificaciones_ci.sql

      - name: Ejecutar las consultas de reportes sobre el dataset masivo
        run: psql -q -v ON_ERROR_STOP=1 -f ScriptSQL/04_Consultas_Reportes.sql > /dev/null
